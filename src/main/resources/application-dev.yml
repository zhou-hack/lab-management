spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lab_management?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false

sa-token:
  is-log: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

lab:
  docs:
    # 开发环境文档公开，便于联调；test/prod 由默认 false 兜底（需登录且 ADMIN）
    public: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
