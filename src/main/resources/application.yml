server:
  # 固定 8081：本机 8080 常被其他项目（cmzs-backend）抢占，导致请求被异系统拦截
  port: 8081

spring:
  application:
    name: lab-management
  profiles:
    active: dev
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # 场地导入：单文件上限 10MB，请求上限 12MB；超限由 GlobalExceptionHandler 转 40000
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
  type-handlers-package: com.labmanage.common.handler

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  # 全局兜底 24h；实际会话超时按用户类型由策略表 SESSION_TIMEOUT_ADMIN（8h）/
  # SESSION_TIMEOUT_STUDENT_TEACHER（2h）在登录时按 token 设置，覆盖本值
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    default-produces-media-type: application/json

knife4j:
  enable: true
  setting:
    language: zh_cn

lab:
  booking:
    # A1：APPROVED 单超过结束时间该时长（小时）仍未清点，定时任务自动完结并释放占用
    auto-finish-delay-hours: 2
  security:
    # B3：敏感操作（删除/启停/审批/强制取消/签到清点/授权）是否要求二级认证（密码确认后 300 秒有效）
    sensitive-safe-check: true
  docs:
    # B2：API 文档（Swagger/Knife4j）是否免登录公开；仅 dev profile 开启，其余环境需登录且 ADMIN 角色
    public: false
