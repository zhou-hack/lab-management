server:
  port: 8080

spring:
  application:
    name: lab-management
  profiles:
    active: dev
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # 导入类接口：单文件上限 10MB，请求上限 12MB；超限由 GlobalExceptionHandler 转 40000
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # record VO（无 setter）按构造参数名自动映射，JOIN 查询直接返回 record
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false
  type-handlers-package: com.labmanage.common.handler

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    default-produces-media-type: application/json

knife4j:
  enable: true
  setting:
    language: zh_cn
