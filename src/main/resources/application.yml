server:
  port: 8080

spring:
  application:
    name: lab-management
  profiles:
    active: dev
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.labmanage.common.mybatis
  global-config:
    banner: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
  swagger-ui:
    enabled: true
  default-produces-media-type: application/json

knife4j:
  enable: true
  setting:
    language: zh_cn
