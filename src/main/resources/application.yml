server:
  port: 8080

spring:
  application:
    name: lab-management
  profiles:
    active: dev
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # 导入类接口：单文件上限 10MB，请求上限 12MB；超限由 GlobalExceptionHandler 转 40000
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # record VO（无 setter）按构造参数名自动映射，JOIN 查询直接返回 record
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false
  type-handlers-package: com.labmanage.common.handler

app:
  jwt:
    # HS256 密钥：至少 32 字节；生产必须经环境变量 JWT_SECRET 注入，dev 默认值仅限本地
    secret: ${JWT_SECRET:lab-management-dev-only-secret-key-32b}
    issuer: lab-management
    # access token 2 小时；refresh token 7 天（均无状态，注销即客户端丢弃）
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800

springdoc:
  api-docs:
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    enabled: true
    default-produces-media-type: application/json

knife4j:
  enable: true
  setting:
    language: zh_cn
